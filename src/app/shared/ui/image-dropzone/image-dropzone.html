<div [appAnexoDrop]="fileInput" [anexoDropDesabilitado]="disabled()" class="dropzone" [class.dropzone--invalid]="invalid()">
  @if (imageUrl()) {
    <img [src]="imageUrl()" alt="Pré-visualização da imagem" class="dropzone__preview" />
  } @else {
    <span class="dropzone__label">Selecione ou arraste uma imagem</span>
  }

  <button type="button" [disabled]="disabled()" class="btn btn-secondary" (click)="openFilePicker()">
    Escolher arquivo
  </button>

  <input
    #fileInput
    type="file"
    [disabled]="disabled()"
    accept="image/jpeg,image/png,image/webp"
    class="dropzone__input"
    (change)="onFileInputChange($event)"
  />
</div>
