<div appBloquearScroll class="modal-backdrop" (click)="$event.target === $event.currentTarget ? closed.emit() : null">
  <section class="modal-card">
    <header class="modal-header">
      <div class="modal-title-area">
        <h2>{{ titulo }}</h2>
        <ng-content select="[modal-title-extra]"></ng-content>
      </div>
      <button type="button" class="modal-close" aria-label="Fechar modal" (click)="closed.emit()">×</button>
    </header>

    <ng-content></ng-content>
  </section>
</div>
