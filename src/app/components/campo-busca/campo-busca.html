<mat-form-field appearance="outline" class="campo-busca">
  <mat-icon matPrefix>search</mat-icon>
  <input
    matInput
    type="text"
    autocomplete="off"
    [formControl]="control"
    [placeholder]="placeholder"
    [attr.aria-label]="placeholder" />
  @if (control.value) {
    <button matSuffix type="button" class="btn-limpar" aria-label="Limpar busca" (click)="limpar()">
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
