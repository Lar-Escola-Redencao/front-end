<section class="public-diretoria-section" *ngIf="!carregando && diretores.length > 0">
  <div class="container">
    <div class="diretoria-header">
      <h2>Composição Administrativa</h2>
      <p>Conheça as pessoas que fazem a nossa OSC acontecer todos os dias.</p>
    </div>

    <div class="diretoria-grid">
      <div class="diretor-card" *ngFor="let membro of diretores">
        <div class="foto-wrapper">
          <img [src]="obterUrlImagem(membro.foto)" (error)="onImageError($event)" [alt]="membro.nome" loading="lazy" />
        </div>
        <div class="info-wrapper">
          <h3 class="nome">{{ membro.nome }}</h3>
          <span class="cargo">{{ membro.cargo }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
