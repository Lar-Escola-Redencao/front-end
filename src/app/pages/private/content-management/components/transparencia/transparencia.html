<section class="transparencia-admin">

  <div class="acoes-transparencia">

    <button type="button" class="btn-primary" (click)="abrirModal('documento')">
      Adicionar documento
    </button>

    <button type="button" class="btn-primary" (click)="abrirModal('secao')">
      Nova seção
    </button>

  </div>

  <div class="abas-container">
    <button type="button" class="aba-btn" [class.ativa]="abaAtiva === 'documentos'" (click)="abaAtiva = 'documentos'">
      Documentos
    </button>
    <button type="button" class="aba-btn" [class.ativa]="abaAtiva === 'secoes'" (click)="abaAtiva = 'secoes'">
      Seções
    </button>
  </div>

  <app-tabela-layout [colunas]="abaAtiva === 'documentos' ? colunasDocumentos : colunasSecoes"
    [dados]="abaAtiva === 'documentos' ? documentos : secoes" [acoes]="acoesTabela" [tamanhoPagina]="10"
    [tamanhosPagina]="[5, 10, 25]"
    [mensagemVazia]="abaAtiva === 'documentos' ? 'Nenhum documento cadastrado.' : 'Nenhuma seção cadastrada.'"
    (acao)="executarAcao($event)" />

</section>

@if (modalAberto === 'documento') {
<app-modal-layout titulo="Adicionar documento" (closed)="fecharModal()">
  <form class="form-modal" [formGroup]="formDocumento" (ngSubmit)="salvarDocumento()">

    <mat-form-field appearance="outline">
      <mat-label>Título do documento</mat-label>
      <input matInput formControlName="titulo" (blur)="verificarErrosDocumento()" maxlength="150" />
      <mat-error *ngIf="errosDocumento['titulo']">{{ errosDocumento['titulo'] }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Seção</mat-label>
      <mat-select formControlName="secaoId" (blur)="verificarErrosDocumento()">
        @for (secao of secoes; track secao.id) {
        <mat-option [value]="secao.id">{{ secao.titulo }}</mat-option>
        }
      </mat-select>
      <mat-error *ngIf="errosDocumento['secaoId']">{{ errosDocumento['secaoId'] }}</mat-error>
    </mat-form-field>

    <!-- Container do Upload -->
    <div style="margin-bottom: 24px;">
      <label class="upload-campo" [class.tem-arquivo]="nomeDocumentoSelecionado">
        <input type="file" accept=".pdf" (change)="selecionarDocumento($event)" />

        @if (nomeDocumentoSelecionado) {
        <span class="arquivo-nome">{{ nomeDocumentoSelecionado }}</span>
        <small>Documento selecionado</small>
        } @else {
        <span>Selecione ou arraste um documento (.pdf)</span>
        }
      </label>
      <!-- Erro customizado para o input de arquivo (já que não é um mat-form-field) -->
      <span class="error-text" *ngIf="errosDocumento['arquivo']">
        {{ errosDocumento['arquivo'] }}
      </span>
    </div>

    <div class="acoes-modal">
      <button type="button" class="btn-cancelar" [disabled]="isLoading" (click)="fecharModal()">
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="formDocumento.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Salvando...' : 'Salvar' }}</span>
      </button>
    </div>

  </form>
</app-modal-layout>
}


@if (modalAberto === 'secao') {
<app-modal-layout [titulo]="modoEdicao ? 'Editar seção' : 'Nova seção'" (closed)="fecharModal()">
  <form class="form-modal" [formGroup]="formSecao" (ngSubmit)="salvarSecao()">

    <!-- Usamos o style="width: 100%" direto e a tag nativa <mat-error> -->
    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 8px;">
      <mat-label>Nome da seção</mat-label>
      <input matInput formControlName="titulo" (blur)="verificarErrosSecao()" maxlength="100" />

      <mat-error *ngIf="errosSecao['titulo']">
        {{ errosSecao['titulo'] }}
      </mat-error>
    </mat-form-field>

    <div class="acoes-modal">
      <button type="button" class="btn-cancelar" [disabled]="isLoading" (click)="fecharModal()">
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="formSecao.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner" aria-hidden="true"></span>
        <span>{{ isLoading ? 'Salvando...' : 'Salvar' }}</span>
      </button>
    </div>

  </form>
</app-modal-layout>
}
