@if (carregando) {
  <div class="carregamento-secao" role="status" aria-label="Carregando diretoria">
    <span class="spinner-carregamento" aria-hidden="true"></span>
  </div>
}
<section class="public-diretoria-section" *ngIf="!carregando">
  <div class="container">
    
    <div class="diretoria-header">
      <h2>Composição da Diretoria</h2>
    </div>

    <div
      class="carousel-container"
      [class.registro-unico]="diretoresOriginal.length === 1"
      *ngIf="diretoresOriginal.length > 0; else semDiretoria">
      <button
        class="nav-btn prev-btn"
        *ngIf="diretoresOriginal.length > 1"
        (click)="prev()"
        aria-label="Anterior">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>

      <div class="carousel-track-wrapper">
        <div class="carousel-track" [class.no-transition]="!isTransitioning" [style.transform]="trackTransform">
          
          <div 
            class="diretor-card-wrapper" 
            *ngFor="let membro of diretoresCarousel; let i = index"
            [style.width]="diretoresOriginal.length === 1 ? '100%' : (100 / itemsPerPage) + '%'">
            
            <div class="diretor-card"
              [class.center-card]="isCenter(i)"
              [class.side-card]="isSide(i)"
              [class.out-of-view-card]="isOutOfView(i)">
              
              <div class="foto-wrapper">
                <img
                  *ngIf="obterUrlImagem(membro.foto)"
                  [src]="obterUrlImagem(membro.foto)"
                  (error)="onImageError($event)"
                  [alt]="membro.nome"
                  loading="lazy" />
                <span
                  class="material-icons imagem-fallback"
                  [class.imagem-fallback-hidden]="obterUrlImagem(membro.foto)"
                  aria-hidden="true">
                  person
                </span>
              </div>
              <div class="info-wrapper">
                <h3 class="nome" [title]="membro.nome">{{ membro.nome }}</h3>
                <span class="cargo" [title]="membro.cargo">{{ membro.cargo }}</span>
              </div>
              
            </div>
          </div>

        </div>
      </div>

      <button
        class="nav-btn next-btn"
        *ngIf="diretoresOriginal.length > 1"
        (click)="next()"
        aria-label="Próximo">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>

    <ng-template #semDiretoria>
      <app-estado-vazio icone="person" mensagem="As informações da diretoria estarão disponíveis em breve." />
    </ng-template>

  </div>
</section>
