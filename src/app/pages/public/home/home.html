<app-public-navbar></app-public-navbar>

<main class="home-main" [class.pagina-erro]="erro() && !carregando()" [attr.aria-busy]="carregando()">
  @if (carregando()) {
    <div class="carregamento-secao home-carregamento" role="status" aria-label="Carregando página inicial">
      <span class="spinner-carregamento" aria-hidden="true"></span>
    </div>
  } @else if (erro()) {
    <app-erro-carregamento (tentarNovamente)="carregar()" />
  }
  <div class="home-conteudo" [hidden]="carregando() || erro()">
    <section id="inicio" class="home-section">
      <p>Seção Início</p>
    </section>

    <section id="unidades" class="home-section">
      <app-public-unidades (carregado)="aoCarregarSecao('unidades', $event)"></app-public-unidades>
    </section>

    <section id="eventos" class="home-section">
      <app-public-eventos (carregado)="aoCarregarSecao('eventos', $event)"></app-public-eventos>
    </section>

    <section id="parceiros" class="home-section">
      <app-public-parceiros (carregado)="aoCarregarSecao('parceiros', $event)"></app-public-parceiros>
    </section>
  </div>
</main>

<app-public-footer></app-public-footer>
