@if (carregando) {
  <div class="carregamento-secao" role="status" aria-label="Carregando parceiros">
    <span class="spinner-carregamento" aria-hidden="true"></span>
  </div>
}
<section class="public-parceiros-section" *ngIf="!carregando">
  <div class="container">
    
    <div class="parceiros-header">
      <h2>{{ titulo }}</h2>
    </div>

    <div 
      class="carousel-container" 
      *ngIf="parceirosOriginal.length > 0; else semParceiros"
      (mouseenter)="stopAutoPlay()" 
      (mouseleave)="startAutoPlay()">
      
      <button
        class="nav-btn prev-btn"
        (click)="prev()"
        [class.hidden]="parceirosOriginal.length <= 1"
        aria-label="Anterior">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>

      <div class="carousel-track-wrapper">
        <div class="carousel-track" [class.no-transition]="!isTransitioning" [style.transform]="trackTransform">
          
          <div class="parceiro-card" *ngFor="let parceiro of parceirosCarousel" [style.min-width]="(100 / itemsPerPage) + '%'">
            <button type="button" class="logo-wrapper" (click)="abrirImagem(parceiro)"
              [disabled]="!podeAmpliar(parceiro)" [attr.aria-label]="'Ampliar imagem de ' + parceiro.nome">
              <img
                *ngIf="podeAmpliar(parceiro)"
                [src]="obterUrlImagem(parceiro.logo)"
                (error)="onImageError(parceiro)"
                [alt]="parceiro.nome"
                loading="lazy" />
              <span
                class="material-symbols-outlined imagem-fallback"
                [class.imagem-fallback-hidden]="podeAmpliar(parceiro)"
                aria-hidden="true">
                volunteer_activism
              </span>
            </button>
            <span class="parceiro-nome">{{ parceiro.nome }}</span>
          </div>

        </div>
      </div>

      <button
        class="nav-btn next-btn"
        (click)="next()"
        [class.hidden]="parceirosOriginal.length <= 1"
        aria-label="Próximo">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>

    <ng-template #semParceiros>
      <app-estado-vazio icone="volunteer_activism" mensagem="Não há parceiros para exibir." />
    </ng-template>

  </div>
</section>

<dialog #lightbox class="lightbox" [attr.aria-label]="parceiroAmpliado?.nome || 'Imagem do parceiro'"
  (click)="fecharAoClicarFora($event)" (close)="aoFecharImagem()">
  @if (parceiroAmpliado; as parceiro) {
    <div appBloquearScroll class="lightbox-conteudo">
      <button type="button" class="lightbox-fechar" (click)="fecharImagem()" aria-label="Fechar imagem ampliada" autofocus>
        <span class="material-symbols-outlined">close</span>
      </button>
      <img class="lightbox-imagem" [src]="obterUrlImagem(parceiro.logo)" [alt]="parceiro.nome">
    </div>
  }
</dialog>
