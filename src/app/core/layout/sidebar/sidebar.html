<nav class="sidebar" [class.sidebar--open]="open()">
  <p class="sidebar__title">Central de gestão</p>

  <ul class="sidebar__list">
    @for (item of navItems; track item.route) {
      <li>
        <a
          class="sidebar__link"
          [routerLink]="item.route"
          routerLinkActive="sidebar__link--active"
          (click)="navigated.emit()"
        >
          <span class="sidebar__icon">
            @switch (item.icon) {
              @case ('clipboard') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="6" y="4" width="12" height="17" rx="2" />
                  <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1" />
                  <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              }
              @case ('smile') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M8.5 10h.01M15.5 10h.01" stroke-linecap="round" />
                  <path d="M8 14c1 1.3 2.4 2 4 2s3-.7 4-2" stroke-linecap="round" />
                </svg>
              }
              @case ('users') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="9" cy="8" r="3.2" />
                  <path d="M3.5 20c0-3.4 2.9-5.5 5.5-5.5s5.5 2.1 5.5 5.5" stroke-linecap="round" />
                  <circle cx="17" cy="9" r="2.5" />
                  <path d="M15.5 14.3c2.6.3 4.5 2.2 4.5 4.7" stroke-linecap="round" />
                </svg>
              }
              @case ('home') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 11 12 4l8 7" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" />
                </svg>
              }
              @case ('globe') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9" />
                  <path
                    d="M3 12h18M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9Z"
                  />
                </svg>
              }
            }
          </span>
          <span class="sidebar__label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
