<div class="dashboard">
  <h1 class="dashboard__title">Central de gestão</h1>
  <p class="dashboard__subtitle">Selecione uma área para começar.</p>

  <div class="dashboard__grid">
    @for (item of navItems; track item.route) {
      <a class="dashboard__card" [routerLink]="item.route">
        <span class="dashboard__card-label">{{ item.label }}</span>
      </a>
    }
  </div>
</div>
