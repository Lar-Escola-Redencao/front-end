<app-modal
  [title]="isEditMode() ? 'Editar rede social' : 'Nova rede social'"
  (closed)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if (isEditMode()) {
      <div class="form-field form-field--inline">
        <label>Ativo</label>
        <app-toggle-switch [(checked)]="active" />
      </div>
    }

    <div class="form-field">
      <label for="social-platform">Plataforma</label>
      <select
        id="social-platform"
        formControlName="platform"
        [class.invalid]="form.controls.platform.invalid && form.controls.platform.touched"
      >
        @for (option of platformOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="social-label">Nome de exibição</label>
      <input
        id="social-label"
        type="text"
        formControlName="label"
        placeholder="Ex: Instagram oficial"
        [class.invalid]="form.controls.label.invalid && form.controls.label.touched"
      />
      @if (form.controls.label.invalid && form.controls.label.touched) {
        <span class="field-error">Informe um nome de exibição.</span>
      }
    </div>

    <div class="form-field">
      <label for="social-url">Link</label>
      <input
        id="social-url"
        type="url"
        formControlName="url"
        placeholder="https://..."
        [class.invalid]="form.controls.url.invalid && form.controls.url.touched"
      />
      @if (form.controls.url.invalid && form.controls.url.touched) {
        <span class="field-error">Informe um link válido (iniciando com http:// ou https://).</span>
      }
    </div>
  </form>

  <div modal-footer>
    <button type="button" class="btn btn-secondary" (click)="closed.emit()">Cancelar</button>
    <button type="button" class="btn btn-primary" [disabled]="saving()" (click)="onSubmit()">
      {{ saving() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</app-modal>
